      <stop offset="50%" stop-color="#9A783E"/>
      <stop offset="100%" stop-color="#7D5E28"/>
    </linearGradient>
    <linearGradient id="charcoalGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
